[package]
name = "execution"
version = "0.1.0"
edition = "2024"
links = "execution"

[workspace]
resolver = "3"

[lib]
path = "src/lib.rs"
test = false
bench = false
doctest = false

[dependencies]
kernel-client = { git = "https://github.com/shuyra-arche/kernel.git", rev = "90d43dbf3ee43fd146f487718eb39e88f2507c05" }

[dev-dependencies]
# Root integration discovery still compiles the historical source-import harness.
env = { package = "kernel-api-env", git = "https://github.com/shuyra-arche/kernel.git", rev = "90d43dbf3ee43fd146f487718eb39e88f2507c05" }
talc = { version = "=5.1.1", default-features = false }
spinning_top = { version = "=0.3.0", default-features = false }
